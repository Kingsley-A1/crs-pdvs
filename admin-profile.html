<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRS-PDVS — Admin Profile</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin-shell.css">
  <link rel="icon" type="image/png" href="assets/images/crs_emblem.png">
  <style>
    .profile-hero {
      background: linear-gradient(135deg, #141762 0%, #1e2275 100%);
      border-radius: 14px; padding: 32px 30px;
      display: flex; align-items: center; gap: 24px;
      margin-bottom: 22px; position: relative; overflow: hidden;
    }
    .profile-hero::after { content:''; position:absolute; right:-50px; top:-50px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(74,92,200,0.15) 0%,transparent 70%); pointer-events:none; }
    .ph-avatar { width: 84px; height: 84px; border-radius: 50%; background: rgba(173,184,236,0.15); border: 3px solid rgba(173,184,236,0.3); color: #adb8ec; font-size: 32px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ph-info { flex: 1; min-width: 0; }
    .ph-name { font-size: 26px; font-weight: 800; color: white; margin-bottom: 6px; letter-spacing: -0.02em; }
    .ph-meta { font-size: 13.5px; color: rgba(255,255,255,0.6); display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }
    
    .profile-grid { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
    @media (max-width: 1100px) { .profile-grid { grid-template-columns: 1fr; } }
    
    .kv-list { display: flex; flex-direction: column; gap: 14px; }
    .kv-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #9ca3af; margin-bottom: 4px; }
    .kv-value { font-size: 14px; color: #111827; font-weight: 500; }
    .kv-divider { border: none; border-top: 1px solid #f3f4f6; margin: 8px 0; }
    
    .timeline { position: relative; padding-left: 26px; }
    .timeline::before { content: ''; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: #e5e7eb; }
    .tl-item { position: relative; margin-bottom: 20px; }
    .tl-item:last-child { margin-bottom: 0; }
    .tl-dot { position: absolute; left: -21px; top: 2px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid white; background: #1e2275; }
    .tl-time { font-size: 11.5px; color: #9ca3af; margin-bottom: 3px; }
    .tl-action { font-size: 13.5px; font-weight: 600; color: #111827; margin-bottom: 2px; }
    .tl-detail { font-size: 12.5px; color: #6b7280; line-height: 1.5; }
  </style>
</head>
<body>

<div class="adm-wrap">
  <div id="adm-sidebar-mount"></div>
  <div class="adm-body">
    <div id="adm-topbar-mount"></div>
    <div class="adm-content" id="profile-content">
       <div style="padding:40px;text-align:center;color:#9ca3af;font-size:13px;">Loading administrator profile…</div>
    </div>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/admin-shell.js"></script>
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get('id');
  const D = window.CRS_PDVS_DATA;

  // If no ID is provided, fall back to the demo/logged-in user.
  let targetUser = null;
  if (targetId) {
    targetUser = D.adminUsers.find(u => u.userId === targetId);
  }
  
  if (!targetUser) {
     try {
       const u = JSON.parse(sessionStorage.getItem('crs_admin_user'));
       if (u && u.userId) targetUser = D.adminUsers.find(a => a.userId === u.userId) || u;
     } catch(e) {}
  }
  
  // Ultimate fallback to first admin
  if (!targetUser) targetUser = D.adminUsers[0];

  const pageTitle = targetUser.firstName + ' ' + targetUser.lastName;
  const { user } = AdminShell.init('users', pageTitle, {
    breadcrumbs: [
      { label: 'Admin Portal', href: 'admin.html' },
      { label: 'Admin Users',  href: 'admin-users.html' },
      { label: pageTitle }
    ]
  });
  
  const { fmtDateTime, statusChip } = AdminShell;
  const content = document.getElementById('profile-content');
  const initials = targetUser.firstName[0] + targetUser.lastName[0];

  // Look for any audit logs involving this actor based on exact name match
  const actorName = targetUser.firstName + ' ' + targetUser.lastName;
  const userLogs = D.auditLogs.filter(log => log.actor === actorName).slice(0, 10);
  
  const timelineHtml = userLogs.length > 0
    ? userLogs.map(l => `
      <div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-time">${fmtDateTime(l.timestamp)}</div>
        <div class="tl-action">${l.action} ${statusChip(l.severity)}</div>
        <div class="tl-detail">${l.detail || l.target || 'System action executed successfully.'}</div>
      </div>
    `).join('')
    : '<div style="color:#9ca3af;font-size:13px;">No recent activity logs found.</div>';

  content.innerHTML = `
    <!-- Hero -->
    <div class="profile-hero">
      <div class="ph-avatar">${initials}</div>
      <div class="ph-info">
        <div class="ph-name">${targetUser.firstName} ${targetUser.lastName}</div>
        <div class="ph-meta">
          <span style="font-weight:600;color:white;">${targetUser.role}</span>
          <span>&middot;</span>
          <span>${targetUser.email}</span>
          <span>&middot;</span>
          <span style="font-family:monospace;">${targetUser.userId}</span>
        </div>
      </div>
      <div style="z-index:1;">
        ${statusChip(targetUser.status)}
      </div>
    </div>

    <!-- Grid -->
    <div class="profile-grid">
      <!-- LEFT -->
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="adm-card">
          <div class="adm-card-header"><div class="adm-card-title">Account Details</div></div>
          <div class="adm-card-body">
            <div class="kv-list">
              <div><div class="kv-label">Assigned Role</div><div class="kv-value">${targetUser.role}</div></div>
              <div><div class="kv-label">Email Address</div><div class="kv-value">${targetUser.email}</div></div>
              <div><div class="kv-label">Jurisdiction</div><div class="kv-value">${targetUser.lga || 'System Wide (All LGAs)'}</div></div>
              <hr class="kv-divider">
              <div><div class="kv-label">Last Login</div><div class="kv-value">${fmtDateTime(targetUser.lastLogin)}</div></div>
              <div><div class="kv-label">Total Actions Recorded</div><div class="kv-value">${targetUser.actions || 0}</div></div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div class="adm-card">
          <div class="adm-card-header"><div class="adm-card-title">Recent Activity Log</div></div>
          <div class="adm-card-body">
            <div class="timeline">${timelineHtml}</div>
          </div>
        </div>
      </div>
    </div>
  `;
})();
</script>

</body>
</html>
